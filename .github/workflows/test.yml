name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: token deep
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/rate_limit" | python3 -m json.tool | head -20
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Asad657/ssrf-test/git/refs" | python3 -m json.tool | head -10
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Asad657/ssrf-test/hooks" | python3 -m json.tool | head -10
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Asad657/ssrf-test/deployments" | python3 -m json.tool | head -10
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Asad657/Assuhere" | python3 -m json.tool | head -10
