name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: arm api
        run: |
          TOKEN=$(curl -s -H "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" | python3 -m json.tool | grep access_token | cut -d'"' -f4)
          echo "Token: $TOKEN"
          curl -s -H "Authorization: Bearer $TOKEN" "https://management.azure.com/subscriptions/994bde16-21c0-4f40-8be7-3a7902797319/resourceGroups?api-version=2021-04-01" | python3 -m json.tool | head -20
