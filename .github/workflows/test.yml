name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: token abuse
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/installation/repositories" | python3 -m json.tool | head -20
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/orgs/github/repos" | python3 -m json.tool | head -10
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/user" | python3 -m json.tool | head -10
